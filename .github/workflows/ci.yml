name: CI

# A v* tag on its own publishes nothing — publishing is triggered by *publishing a GitHub Release*,
# which is a deliberate act with release notes attached, and is then gated again on approval of the
# `release` environment. See docs/RELEASING.md.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Shared runners are a handful of slow vCPUs: integration-test deadlines get 4x the wall
      # clock (see the TestTime helpers in the test projects). Assertions are unchanged — the
      # awaited conditions still have to come true, they are just allowed to take longer here.
      MELANGE_TEST_TIME_SCALE: "4"
      # The cluster and load suites run only in the local loop, not here: they are multi-node
      # integration machinery calibrated against real hardware, and on 2-vCPU shared runners
      # they fail for reasons that indict the runner, not the code (walk-during-handoff and the
      # hotspot floor were the last two). They still BUILD in this job — warnings-as-errors
      # covers every project — they just don't execute. The bar for them is unchanged: the
      # full suite, both configs, zero skips, run locally before any push (see the repeated
      # contended-loop recipe in the PR histories of #19 and #21).
      # Individual stress tests inside the kept suites opt out the same way with
      # [Trait("Category", "Stress")] — the --filter below excludes them here, never locally.
      CI_TEST_PROJECTS: >-
        Core CodeGen Transport Host Storage.Faster Storage.Postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MelangeDB.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build MelangeDB.slnx -c Release --no-restore

      # shell: bash on the test steps is load-bearing: it makes Actions run them with
      # `bash -eo pipefail`, so a failing `dotnet test` propagates through the tee pipe.
      # The default `run:` shell is `bash -e` WITHOUT pipefail, which would report tee's
      # exit code — always green.
      - name: Test (Release)
        shell: bash
        run: |
          for name in $CI_TEST_PROJECTS; do
            dotnet test "tests/MelangeDB.$name.Tests/MelangeDB.$name.Tests.csproj" -c Release --no-build --filter "Category!=Stress" 2>&1 | tee -a test-release.log
          done
          # Zero-skip enforcement: the Postgres suite self-skips when Docker is missing, and a
          # silently skipped suite must fail loudly here. Matches any nonzero "Skipped:" count
          # in the per-project result summaries.
          if grep -E 'Skipped:\s*[1-9]' test-release.log; then
            echo '::error::Skipped tests detected in the Release run; CI requires zero skips.'
            exit 1
          fi

      - name: Build (Debug, warnings as errors)
        run: dotnet build MelangeDB.slnx -c Debug --no-restore

      - name: Test (Debug)
        shell: bash
        run: |
          for name in $CI_TEST_PROJECTS; do
            dotnet test "tests/MelangeDB.$name.Tests/MelangeDB.$name.Tests.csproj" -c Debug --no-build --filter "Category!=Stress" 2>&1 | tee -a test-debug.log
          done
          if grep -E 'Skipped:\s*[1-9]' test-debug.log; then
            echo '::error::Skipped tests detected in the Debug run; CI requires zero skips.'
            exit 1
          fi

  # Packs a -ci.N prerelease from main and keeps it as a workflow artifact — downloadable and
  # inspectable, but never pushed to a public feed. A version pushed to nuget.org can never be
  # deleted, only unlisted, and a prerelease per commit to main is not a stream worth making
  # permanent. Deliberately has no `environment`, so ordinary pushes to main never wait on a
  # reviewer. Pull requests never reach this job.
  pack:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKABLE: >-
        Abstractions Core Protocol Client Server CodeGen
        Storage.Faster Storage.Postgres Cluster OpenTelemetry Cli
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack prerelease
        run: |
          suffix="ci.${{ github.run_number }}+${GITHUB_SHA::7}"
          for name in $PACKABLE; do
            dotnet pack "src/MelangeDB.$name/MelangeDB.$name.csproj" -c Release -o packages \
              --version-suffix "$suffix"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages-ci.${{ github.run_number }}
          path: packages/*.nupkg
          if-no-files-found: error

  # Publishes to nuget.org. Triggered only by *publishing a GitHub Release* — a pushed tag alone
  # does nothing — and gated a second time behind the `release` environment's required reviewer.
  # Runs only after the test job above is green, so a broken release never publishes.
  #
  # Authentication is nuget.org Trusted Publishing (OIDC): no long-lived API key exists anywhere.
  # NOTE: the trusted publishing policy is bound to this workflow's FILE NAME — renaming ci.yml, or
  # moving this job into a different workflow file, breaks publishing until the policy on nuget.org
  # is updated to match. If the policy also names an Environment, it must equal `release` below.
  publish:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write        # required: lets this job request the OIDC token nuget.org exchanges
    env:
      FEED: https://api.nuget.org/v3/index.json
      PACKABLE: >-
        Abstractions Core Protocol Client Server CodeGen
        Storage.Faster Storage.Postgres Cluster OpenTelemetry Cli
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify release tag matches VersionPrefix
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          prefix=$(sed -n 's/.*<VersionPrefix>\(.*\)<\/VersionPrefix>.*/\1/p' Directory.Build.props)
          if [ "${TAG#v}" != "$prefix" ]; then
            echo "::error::Release tag $TAG does not match VersionPrefix $prefix in Directory.Build.props."
            exit 1
          fi

      - name: Verify NUGET_USER is set
        run: |
          if [ -z "${{ secrets.NUGET_USER }}" ]; then
            echo '::error::NUGET_USER is not set. It is your nuget.org profile name, not your email'
            echo '::error::address, and it is not a credential — see docs/RELEASING.md.'
            exit 1
          fi

      - name: Pack
        run: |
          for name in $PACKABLE; do
            dotnet pack "src/MelangeDB.$name/MelangeDB.$name.csproj" -c Release -o packages
          done

      # The exchanged key is valid for one hour, so it is requested immediately before the push
      # rather than at the top of the job. One OIDC token buys exactly one API key.
      - name: NuGet login (OIDC → short-lived key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push 'packages/*.nupkg' \
            --source "$FEED" \
            --api-key '${{ steps.login.outputs.NUGET_API_KEY }}' \
            --skip-duplicate

name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For **security vulnerabilities**, do not open an issue — see
        [SECURITY.md](https://github.com/tyler-loy/MelangeDB/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        The smallest thing that shows it — a failing test is ideal. Table and reducer definitions
        are usually the part that matters.
      render: csharp
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0, or a commit sha"
    validations:
      required: true

  - type: dropdown
    id: store
    attributes:
      label: Hot store
      options:
        - InMemoryHotStore
        - FasterHotStore
        - Not sure / not relevant
    validations:
      required: true

  - type: dropdown
    id: topology
    attributes:
      label: Topology
      options:
        - Single node
        - Clustered (hub + shards)
        - Not sure / not relevant
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: >
        Relevant `MelangeDb:` configuration, logs, stack traces, or the OS and .NET SDK version if
        you think they matter.
